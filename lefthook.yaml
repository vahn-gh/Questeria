pre-commit:
  parallel: true
  commands:
    packagejson:
      glob: "package.json"
      run: node scripts/validatePackagejson.js

    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: yarn tsc

    prettier:
      glob: "{scripts,__tests__,src}/**/*.{js,ts,tsx,scss,css,json}"
      run: yarn prettier {staged_files} --check --config .prettierrc

    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "scripts/**"
      run: yarn oxlint {staged_files}

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: yarn commitlint --edit
